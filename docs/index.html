<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="SM232X.FFW 固件加解密工具，纯浏览器本地处理，无需上传文件。">
  <meta name="theme-color" content="#fbfafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15111c" media="(prefers-color-scheme: dark)">
  <title>SM232X FFW 加解密工具</title>
  <link rel="shortcut icon" href="https://www.raana.icu/images/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/css/common.css" />
  <link rel="stylesheet" href="src/css/style.css" />

  <script>
    // 在首次绘制前应用已保存的主题，避免切换闪烁
    (function () {
      try {
        var saved = localStorage.getItem('ffw-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="/" class="brand">
        <span class="chip-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="7" y="7" width="10" height="10" rx="1.6"/>
            <line x1="9.5" y1="7" x2="9.5" y2="3.2"/>
            <line x1="14.5" y1="7" x2="14.5" y2="3.2"/>
            <line x1="9.5" y1="17" x2="9.5" y2="20.8"/>
            <line x1="14.5" y1="17" x2="14.5" y2="20.8"/>
            <line x1="7" y1="9.5" x2="3.2" y2="9.5"/>
            <line x1="7" y1="14.5" x2="3.2" y2="14.5"/>
            <line x1="17" y1="9.5" x2="20.8" y2="9.5"/>
            <line x1="17" y1="14.5" x2="20.8" y2="14.5"/>
            <circle class="chip-dot" cx="9.3" cy="9.3" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        FFW Decode Tool
      </a>
      <div class="nav-right">
        <a class="icon-btn" href="https://github.com/M0rt1s0114/FFW_Decode_Tool" target="_blank" rel="noopener" aria-label="查看 GitHub 仓库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        </a>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换浅色/深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M3 12h2M19 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>
      🔐 SM232X FFW 加解密工具
      <small>编码 · 解码</small>
    </h1>
    <div class="sub">
      选择文件，然后点击「解码」或「编码」，处理后自动下载结果文件。
    </div>

    <div class="tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
      <div>文件仅在浏览器本地处理，不会上传至任何服务器。</div>
    </div>

    <!-- 文件选择 -->
    <div class="file-input">
      <input type="file" id="fileInput" accept="*/*" />
    </div>

    <!-- 按钮组 -->
    <div class="buttons">
      <button class="btn btn-success" id="decodeBtn">🔓 解码 (Decode)</button>
      <button class="btn btn-primary" id="encodeBtn">🔒 编码 (Encode)</button>
    </div>

    <!-- 状态消息 -->
    <div id="status" class="message info">📌 就绪，请选择文件。</div>

    <!-- 页脚 -->
    <div class="footer-note">
      <a href="https://github.com/M0rt1s0114/FFW_Decode_Tool" target="_blank" rel="noopener noreferrer" class="github-link">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>Made By Ryuuka_Hoshino · 项目地址</span>
      </a>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('themeToggle');
      if (!toggle) return;
      toggle.addEventListener('click', function () {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        var current = root.getAttribute('data-theme') || (mql.matches ? 'dark' : 'light');
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('ffw-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
